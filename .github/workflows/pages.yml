# Publica la carpeta web/ en GitHub Pages cada vez que cambia en main.
name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:   # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si hay dos publicaciones seguidas, se cancela la vieja y queda la última.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
